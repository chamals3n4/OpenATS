name: Deploy backend

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"

jobs:
  # Deploy only runs if the full test suite passes.
  test:
    uses: ./.github/workflows/test.yml

  deploy:
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4.2.2

      - name: Deploy to Azure VM via SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Abort on the first failing command. Without this, a failed step
            # is ignored and the job reports success because only the last
            # command sets the exit code.
            set -e

            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh" || true

            cd /home/azureuser/OpenATS

            # reset --hard, not pull: any local drift on the VM makes a merge
            # abort, which previously left the server on stale code.
            git fetch origin main
            git reset --hard origin/main

            # Single pnpm workspace, so install from the repo root.
            pnpm install --frozen-lockfile
            pnpm --filter ./backend build
            pnpm --filter ./backend exec drizzle-kit migrate

            pm2 restart ecosystem.config.js --update-env
            pm2 save

            # Fail the deploy if the app did not come back up.
            sleep 5
            curl -fsS http://localhost:8080/health
