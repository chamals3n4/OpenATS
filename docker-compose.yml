name: openats

services:
  postgres:
    image: postgres:17
    container_name: openats-postgres
    environment:
      POSTGRES_USER: openats
      POSTGRES_PASSWORD: openats
      POSTGRES_DB: openats
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: openats-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  postgres-test:
    image: postgres:17
    container_name: openats-postgres-test
    environment:
      POSTGRES_USER: openats
      POSTGRES_PASSWORD: openats
      POSTGRES_DB: openats_test
    ports:
      - "5433:5432"
    tmpfs:
      - /var/lib/postgresql/data

volumes:
  postgres-data:
  redis-data:
