name: openats

services:
  postgres:
    image: postgres:17
    container_name: openats-postgres
    environment:
      POSTGRES_USER: openats
      POSTGRES_PASSWORD: openats
      POSTGRES_DB: openats
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: openats-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

  # Catches every email the app sends; open the inbox at http://localhost:8025
  mailpit:
    image: axllent/mailpit:v1.31.4
    container_name: openats-mailpit
    ports:
      - "1025:1025"
      - "8025:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
