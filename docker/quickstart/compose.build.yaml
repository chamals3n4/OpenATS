# Builds the images from this checkout instead of downloading them, to try changes to the
# quickstart before a release:
#
#   docker compose -f docker/quickstart/compose.yaml -f docker/quickstart/compose.build.yaml up --build

services:
  config:
    image: openats-backend:local
  setup:
    image: openats-backend:local
    build: { context: ../.., dockerfile: docker/backend.Dockerfile }
  api:
    image: openats-backend:local
  worker:
    image: openats-backend:local
  admin:
    image: openats-web:local
  web:
    image: openats-web:local
    build: { context: ../.., dockerfile: docker/web.Dockerfile }
