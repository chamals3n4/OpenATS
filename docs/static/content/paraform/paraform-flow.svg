<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 446" role="img" aria-label="Paraform candidates flow into OpenATS; decisions are made on Paraform" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#8f8f88"/>
    </marker>
  </defs>
  <rect width="760" height="446" fill="#ffffff"/>
  <text x="24" y="32" font-size="15" font-weight="600" fill="#1f1f1f">Paraform candidates flow into OpenATS; decisions are made on Paraform</text>

  <rect x="24" y="52" width="712" height="132" rx="8" fill="#efeeea" stroke="#d9d9d4"/>
  <text x="36" y="76" font-weight="600" fill="#5f5f5a">Paraform</text>
  <rect x="24" y="200" width="712" height="222" rx="8" fill="none" stroke="#d9d9d4"/>
  <text x="36" y="224" font-weight="600" fill="#5f5f5a">OpenATS</text>

  <g fill="none" stroke="#8f8f88" stroke-width="1.25">
    <path d="M216 154V230" marker-end="url(#arrow)"/>
    <path d="M304 266H344" marker-end="url(#arrow)"/>
    <path d="M520 266H560" marker-end="url(#arrow)"/>
    <path d="M216 302V334" marker-end="url(#arrow)"/>
    <path d="M648 230V154" marker-end="url(#arrow)"/>
  </g>
  <text x="226" y="322" font-size="11.5" fill="#5f5f5a">not exactly one email</text>
  <text x="658" y="196" font-size="11.5" fill="#5f5f5a">you decide</text>

  <g text-anchor="middle">
    <rect x="128" y="82" width="176" height="72" rx="8" fill="none" stroke="#8f8f88" stroke-width="1.25"/>
    <text x="216" y="106" font-weight="600" fill="#1f1f1f">Recruiter submits</text>
    <text x="216" y="122" font-size="11.5" fill="#5f5f5a">a candidate to a role</text>
    <text x="216" y="138" font-size="11.5" fill="#5f5f5a">on Paraform</text>

    <rect x="128" y="230" width="176" height="72" rx="8" fill="none" stroke="#8f8f88" stroke-width="1.25"/>
    <text x="216" y="254" font-weight="600" fill="#1f1f1f">OpenATS syncs</text>
    <text x="216" y="270" font-size="11.5" fill="#5f5f5a">every 15 minutes,</text>
    <text x="216" y="286" font-size="11.5" fill="#5f5f5a">or on Sync now</text>

    <rect x="344" y="230" width="176" height="72" rx="8" fill="none" stroke="#8f8f88" stroke-width="1.25"/>
    <text x="432" y="254" font-weight="600" fill="#1f1f1f">Candidate imported</text>
    <text x="432" y="270" font-size="11.5" fill="#5f5f5a">into the linked job's</text>
    <text x="432" y="286" font-size="11.5" fill="#5f5f5a">first stage, no email</text>

    <rect x="560" y="230" width="176" height="72" rx="8" fill="none" stroke="#8f8f88" stroke-width="1.25"/>
    <text x="648" y="254" font-weight="600" fill="#1f1f1f">You review</text>
    <text x="648" y="270" font-size="11.5" fill="#5f5f5a">CV, scores, interviews</text>
    <text x="648" y="286" font-size="11.5" fill="#5f5f5a">with the hiring team</text>

    <rect x="128" y="334" width="176" height="72" rx="8" fill="none" stroke="#8f8f88" stroke-width="1.25"/>
    <text x="216" y="358" font-weight="600" fill="#1f1f1f">Skipped</text>
    <text x="216" y="374" font-size="11.5" fill="#5f5f5a">reason in the sync log;</text>
    <text x="216" y="390" font-size="11.5" fill="#5f5f5a">admin adds by hand</text>

    <rect x="560" y="82" width="176" height="72" rx="8" fill="#2f6fdb" fill-opacity="0.12" stroke="#2f6fdb" stroke-width="2"/>
    <text x="648" y="106" font-weight="600" fill="#1f1f1f">Decide on Paraform</text>
    <text x="648" y="122" font-size="11.5" fill="#1f1f1f">via Open in Paraform;</text>
    <text x="648" y="138" font-size="11.5" fill="#1f1f1f">the recruiter is told</text>
  </g>
</svg>
