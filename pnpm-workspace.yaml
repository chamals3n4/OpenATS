packages:
  - "backend"
  - "frontend"
  - "docs"

allowBuilds:
  core-js: false
  msw: false
  sharp: false
  unrs-resolver: false
  "@scarf/scarf": true
  esbuild: true
  msgpackr-extract: true
  protobufjs: true
  '@google/genai': true
  '@swc/core': false

# Security fixes for packages that other packages pull in. Each override only touches the
# vulnerable versions and stays on the major version the parent asks for, unless no fixed
# version exists in that major. Remove an entry once its parent ships the fix itself.
overrides:
  "brace-expansion@<1.1.21": "^1.1.21"
  "brace-expansion@>=2 <2.1.7": "^2.1.7"
  "brace-expansion@>=5 <5.0.12": "^5.0.12"
  "compression@<1.8.2": "^1.8.2"
  "esbuild@<0.24.3": "^0.25.12"
  "fast-uri@<3.1.8": "^3.1.8"
  "hono@<4.13.7": "^4.13.13"
  "http-cache-semantics@<4.2.1": "^4.3.0"
  "image-size@<2.0.3": "^2.0.4"
  "joi@<17.13.8": "^17.13.8"
  "js-yaml@>=4 <4.3.2": "^4.3.2"
  "nanoid@>=3 <3.3.18": "^3.3.20"
  "postcss-selector-parser@<7.1.6": "^7.1.6"
  "qs@<6.16.0": "^6.16.0"
  "serialize-javascript@<7.0.5": "^7.1.2"
  "seroval@<1.6.3": "^1.6.9"
  "source-map-js@<1.2.2": "^1.2.2"
  "tinypool@<2.1.2": "^2.2.0"
  "uuid@<11.1.1": "^11.1.1"
